# Two services from one repo, brand selected by env var.
#
#   brainlift-central -> serves Brainlift Central. Maps to the existing
#                        prod service in the Render dashboard (display
#                        name "DOK1GraderV3", service ID
#                        srv-d5fu0p4hg0os73e072ng), which was repurposed
#                        for BC. AlphaX moved to its own service below.
#
#   keystone-buddy      -> serves AlphaX Buddy. New service to be created
#                        on cutover.
#
# Custom domains are attached manually in the Render dashboard at deploy
# time — not declared here. (The second service is not yet deployed.)

services:
  - type: web
    name: brainlift-central
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: BRAND
        value: brainlift
      - key: VITE_BRAND
        value: brainlift
      - key: VITE_BRAND_NAME
        value: Brainlift Central
      - key: PORT
        value: 10000
    healthCheckPath: /api/brainlifts

  - type: web
    name: keystone-buddy
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (same value as brainlift-central)
      - key: OPENROUTER_API_KEY
        sync: false  # Set manually in Render dashboard (same value as brainlift-central)
      - key: BRAND
        value: keystone
      - key: VITE_BRAND
        value: keystone
      - key: VITE_BRAND_NAME
        value: AlphaX Buddy
      - key: PORT
        value: 10000
    healthCheckPath: /api/brainlifts
